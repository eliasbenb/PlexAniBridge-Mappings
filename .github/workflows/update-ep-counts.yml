name: Episode Count Update

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: "Source to update (anilist, tmdb, tvdb, or all)"
        required: true
        default: "all"
        type: choice
        options:
          - anilist
          - tmdb
          - tvdb
          - all

jobs:
  update-episode-counts:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%B %d, %Y %I:%M %p')" >> $GITHUB_OUTPUT

      - name: Check Out Repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Update Episode Counts (scheduled)
        if: github.event_name == 'schedule'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_ep_counts.py --source all

      - name: Run Update Episode Counts (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_ep_counts.py --source ${{ github.event.inputs.source }}

      - name: Check Diff
        id: verify_diff
        run: |
          git diff .
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push Changes
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Episode counts updated at ${{ steps.date.outputs.date }} UTC" -a
          git push
